<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지호♥︎와의 대화</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050507;
            color: #e5e7eb;
            user-select: none;
        }

        /* Custom scrollbar */
        .chat-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(6px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-pop {
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen w-screen bg-[#050507] overflow-hidden sm:py-4">

                    타이머 리셋

                    지금 전화

        </div>

                        지호♥︎
                    </span>
                    <span class="text-[11px] text-gray-500 font-normal">온라인</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 text-gray-300">
                <button onclick="triggerCallNow()" class="p-2 hover:bg-[#1a1b22] text-green-400 rounded-full transition-colors" title="전화 걸기">

                        <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path>
                    </svg>
                </button>
                <button class="p-2 hover:bg-[#1a1b22] rounded-full transition-colors" title="메뉴">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </header>

        function startCallCountdown() {
            clearInterval(callTimerInterval);
            countdownValue = 25;
            document.getElementById('countdown-text').textContent = countdownValue;
            document.getElementById('call-timer-status').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
                전화 대기 중 (<span id="countdown-text">${countdownValue}</span>초)
            `;

            callTimerInterval = setInterval(() => {
                countdownValue--;
                const countEl = document.getElementById('countdown-text');
                if (countEl) countEl.textContent = countdownValue;

                if (countdownValue <= 0) {
                    clearInterval(callTimerInterval);
                    triggerCallNow();
                }
            }, 1000);
        }

        function resetCallTimer() {
            startCallCountdown();
        }

        function playRingtone() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Create periodic tone generator for incoming call sound
                ringtoneGain = audioCtx.createGain();
                ringtoneGain.gain.value = 0.15;
                ringtoneGain.connect(audioCtx.destination);

                let isBeep = false;
                ringtoneOscillator = setInterval(() => {
                    if (!audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(isBeep ? 523.25 : 659.25, audioCtx.currentTime); // C5 & E5
                    osc.connect(ringtoneGain);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.35);
                    isBeep = !isBeep;
                }, 500);
            } catch (e) {
                console.log("Audio play blocked or unsupported:", e);
            }
        }

        function stopRingtone() {
            if (ringtoneOscillator) {
                clearInterval(ringtoneOscillator);
                ringtoneOscillator = null;
            }
        }

        function triggerCallNow() {
            clearInterval(callTimerInterval);
            document.getElementById('call-timer-status').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                은지호 전화 연결 중...
            `;

            document.getElementById('call-status-subtitle').textContent = "음성 통화 요청 중...";
            document.getElementById('incoming-buttons').classList.remove('hidden');
            document.getElementById('incoming-buttons').classList.add('flex');
            document.getElementById('active-buttons').classList.add('hidden');
            document.getElementById('active-call-timer').classList.add('hidden');

            const callScreen = document.getElementById('call-screen');
            callScreen.classList.remove('hidden');
            callScreen.classList.add('flex');

            playRingtone();
        }

        function acceptCall() {
            stopRingtone();
            document.getElementById('call-status-subtitle').textContent = "통화 중";
            document.getElementById('incoming-buttons').classList.add('hidden');
            document.getElementById('incoming-buttons').classList.remove('flex');
            
            document.getElementById('active-buttons').classList.remove('hidden');
            document.getElementById('active-buttons').classList.add('flex');
            
            const timerEl = document.getElementById('active-call-timer');
            timerEl.classList.remove('hidden');

            callActiveDuration = 0;
            clearInterval(activeCallTimerInterval);
            activeCallTimerInterval = setInterval(() => {
                callActiveDuration++;
                const mins = String(Math.floor(callActiveDuration / 60)).padStart(2, '0');
                const secs = String(callActiveDuration % 60).padStart(2, '0');
                timerEl.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function declineCall() {
            stopRingtone();
            closeCallScreen();
        }

        function endCall() {
            clearInterval(activeCallTimerInterval);
            stopRingtone();
            closeCallScreen();
        }

        function closeCallScreen() {
            const callScreen = document.getElementById('call-screen');
            callScreen.classList.add('hidden');
            callScreen.classList.remove('flex');

            document.getElementById('call-timer-status').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-gray-500"></span>
                통화 종료됨
            `;
        }

        function setSender(role) {
            currentSender = role;
            const btnOther = document.getElementById('toggle-other');
            const btnMe = document.getElementById('toggle-me');

            if (role === 'other') {
                btnOther.className = "px-2.5 py-1 text-[11px] font-medium rounded-md transition-all text-gray-200 bg-[#2b2d3a] shadow-sm";
                btnMe.className = "px-2.5 py-1 text-[11px] font-medium rounded-md transition-all text-gray-400 hover:text-gray-200";
            } else {
                btnMe.className = "px-2.5 py-1 text-[11px] font-medium rounded-md transition-all text-gray-200 bg-[#007AFF] shadow-sm";
                btnOther.className = "px-2.5 py-1 text-[11px] font-medium rounded-md transition-all text-gray-400 hover:text-gray-200";
            }
        }

        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            conversationHistory.forEach((item) => {
                if (item.type === 'date') {
                    const dateEl = document.createElement('div');
                    dateEl.className = 'flex justify-center my-5 animate-pop';
                    dateEl.innerHTML = `
                        <span class="text-[11px] text-gray-400 font-medium tracking-tight px-3.5 py-1 rounded-full bg-[#161821] border border-[#222533]">
                            ${item.text}
                        </span>
                    `;
                    container.appendChild(dateEl);
                } else {
                    const isMe = item.sender === 'me';
                    const wrapper = document.createElement('div');
                    wrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1 animate-pop`;

                    const bubbleFlex = document.createElement('div');
                    bubbleFlex.className = `flex items-end gap-1.5 max-w-[80%] ${isMe ? 'flex-row-reverse' : 'flex-row'}`;

                    const bubble = document.createElement('div');
                    bubble.className = `px-3.5 py-2 rounded-[18px] text-[13.5px] leading-[1.45] break-words ${
                        isMe 
                            ? 'bg-[#007AFF] text-white rounded-tr-[4px] font-normal shadow-sm' 
                            : 'bg-[#22232a] text-gray-100 rounded-tl-[4px] font-normal'
                    }`;
                    bubble.textContent = item.text;

                    bubbleFlex.appendChild(bubble);

                    if (item.time) {
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'text-[10px] text-gray-500 shrink-0 pb-0.5 select-none font-light';
                        timeSpan.textContent = item.time;
                        bubbleFlex.appendChild(timeSpan);
                    }

                    wrapper.appendChild(bubbleFlex);
                    container.appendChild(wrapper);
                }
            });

            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const timeInput = document.getElementById('time-input');
            const text = input.value.trim();

            if (!text) return;

            conversationHistory.push({
                type: 'message',
                sender: currentSender,
                text: text,
                time: timeInput.value.trim() || undefined
            });

            input.value = '';
            renderChat();
        }

        window.onload = () => {
            renderChat();
            startCallCountdown();
        };
    </script>
</body>
</html>
